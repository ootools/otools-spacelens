[package]
name = "otools-spacelens-service"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[[bin]]
name = "spacelensd"
path = "src/main.rs"

[lib]
name = "otools_spacelens_service"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
walkdir = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
